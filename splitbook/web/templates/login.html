<!-- splitbook/web/templates/login.html — 選身分 + PIN -->
{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}登入 — HomeBook{% endblock %}
{% block content %}
<div class="auth-page">
  <h1>你是誰？</h1>
  <form method="post" action="/login" class="auth-form">
    {% for g in groups %}
    <fieldset class="chips login-members">
      <legend>{{ g.group['name'] }}</legend>
      {% for m in g.members %}
      {% set row = g.rows[loop.index0] %}
      <label class="chip chip-member">
        <input type="radio" name="member_id" value="{{ m['id'] }}" required>
        <span>{{ ui.avatar(m['name'], m['color']) }}{{ m['name'] }}{% if row['pin_hash'] is none %}<em class="muted">（尚未設定 PIN）</em>{% endif %}</span>
      </label>
      {% endfor %}
    </fieldset>
    {% endfor %}
    <label>PIN <input name="pin" type="password" inputmode="numeric"
           placeholder="第一次登入即設定 PIN" autocomplete="current-password"></label>
    <button class="btn btn-primary btn-lg" type="submit">登入</button>
  </form>
  <p><a class="more-link" href="/setup">＋ 建立新家庭</a></p>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" />
  <title>{% block title %}TripSplit{% endblock %}</title>

  <!-- Google Fonts: Fira Sans + Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-base':    '#0F172A',
            'bg-card':    '#1E293B',
            'border-def': '#334155',
            'txt-primary':   '#F8FAFC',
            'txt-secondary': '#94A3B8',
            'txt-muted':     '#64748B',
            'accent-blue':   '#2563EB',
            'accent-orange': '#F97316',
            'status-paid':    '#34D399',
            'status-unpaid':  '#F97316',
            'status-partial': '#3B82F6',
            'amt-positive':   '#34D399',
            'amt-negative':   '#F87171',
          },
          fontFamily: {
            sans: ['Fira Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'ui-monospace', 'monospace'],
          },
        },
      },
    }
  </script>

  <!-- htmx -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-bg-base text-txt-primary font-sans min-h-screen">

  <!-- ══ Desktop sidebar navigation (≥1024px) ══ -->
  <aside class="hidden lg:flex fixed left-0 top-0 bottom-0 w-56 bg-bg-card border-r border-border-def flex-col z-40"
         role="navigation" aria-label="主要導覽列">
    <!-- Sidebar logo -->
    <div class="px-5 flex items-center h-16">
      <span class="text-lg font-bold tracking-wide text-txt-primary">TripSplit</span>
    </div>
    <!-- Sidebar nav links -->
    <nav class="flex-1 px-3 py-2 space-y-1">
      <a href="/"
         class="nav-link {% if active_tab == 'members' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m4 0a4 4 0 110-8 4 4 0 010 8zm6 0a3 3 0 110-6 3 3 0 010 6zM3 14a3 3 0 110-6 3 3 0 010 6z" />
        </svg>
        <span>人員</span>
      </a>
      <a href="/expenses"
         class="nav-link {% if active_tab == 'expenses' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>帳目</span>
      </a>
      <a href="/settlement"
         class="nav-link {% if active_tab == 'settlement' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>結算</span>
      </a>
    </nav>
  </aside>

  <!-- ══ Fixed top header ══ -->
  <header class="fixed top-0 left-0 right-0 lg:left-56 z-50 bg-bg-card border-b border-border-def">
    <div class="flex items-center justify-between px-4 lg:px-6 h-14">
      <!-- Mobile: show logo / Desktop: hidden (logo in sidebar) -->
      <span class="text-lg font-bold tracking-wide text-txt-primary lg:hidden">TripSplit</span>
      <!-- Desktop: show page title -->
      <span class="hidden lg:block text-base font-semibold text-txt-primary">{% block page_title %}{% endblock %}</span>
      {% block header_actions %}{% endblock %}
    </div>
  </header>

  <!-- ══ Main content area ══ -->
  <main class="pt-14 pb-20 lg:pb-8 lg:pl-56 min-h-screen">
    <div class="max-w-6xl mx-auto">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- ══ Mobile bottom tab bar (hidden on desktop) ══ -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-bg-card border-t border-border-def">
    <div class="flex items-stretch justify-around">

      <!-- 人員 tab -->
      <a href="/"
         class="flex flex-col items-center justify-center flex-1 gap-1 py-2 min-h-[56px]
                {% if active_tab == 'members' %}text-accent-blue{% else %}text-txt-muted hover:text-txt-secondary{% endif %}
                transition-colors duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m4 0a4 4 0 110-8 4 4 0 010 8zm6 0a3 3 0 110-6 3 3 0 010 6zM3 14a3 3 0 110-6 3 3 0 010 6z" />
        </svg>
        <span class="text-xs font-medium leading-none">人員</span>
      </a>

      <!-- 帳目 tab -->
      <a href="/expenses"
         class="flex flex-col items-center justify-center flex-1 gap-1 py-2 min-h-[56px]
                {% if active_tab == 'expenses' %}text-accent-blue{% else %}text-txt-muted hover:text-txt-secondary{% endif %}
                transition-colors duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-xs font-medium leading-none">帳目</span>
      </a>

      <!-- 結算 tab -->
      <a href="/settlement"
         class="flex flex-col items-center justify-center flex-1 gap-1 py-2 min-h-[56px]
                {% if active_tab == 'settlement' %}text-accent-blue{% else %}text-txt-muted hover:text-txt-secondary{% endif %}
                transition-colors duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-xs font-medium leading-none">結算</span>
      </a>

    </div>
  </nav>

</body>
</html>

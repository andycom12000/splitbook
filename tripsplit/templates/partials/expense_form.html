<!-- Bottom-sheet modal for expense create/edit -->

<!-- Backdrop -->
<div id="expense-modal-backdrop"
     class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm"
     onclick="document.getElementById('modal-container').innerHTML = ''">
</div>

<!-- Sheet card -->
<div id="expense-modal-sheet"
     class="fixed inset-x-0 bottom-0 z-50 bg-bg-card rounded-t-2xl border-t border-border-def
            shadow-2xl overflow-hidden
            animate-slide-up"
     style="max-height: 92vh; overflow-y: auto;">

  <!-- Handle bar -->
  <div class="flex justify-center pt-3 pb-1">
    <div class="w-10 h-1 rounded-full bg-border-def"></div>
  </div>

  <!-- Header -->
  <div class="flex items-center justify-between px-5 py-3 border-b border-border-def">
    <h2 class="text-base font-semibold text-txt-primary">
      {% if expense %}編輯帳目{% else %}新增帳目{% endif %}
    </h2>
    <button type="button"
            onclick="document.getElementById('modal-container').innerHTML = ''"
            class="w-8 h-8 flex items-center justify-center rounded-full
                   text-txt-muted hover:text-txt-primary hover:bg-bg-base
                   transition-colors duration-150"
            aria-label="關閉">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Form -->
  <form method="POST"
        action="{% if expense %}/api/expenses/{{ expense.id }}/update{% else %}/api/expenses{% endif %}"
        class="px-5 pt-4 pb-24 space-y-5">

    <!-- 項目名稱 -->
    <div>
      <label for="exp-name" class="block text-xs font-medium text-txt-secondary mb-1.5">
        項目名稱 <span class="text-red-400">*</span>
      </label>
      <input
        id="exp-name"
        name="name"
        type="text"
        required
        placeholder="例：花蓮民宿兩晚"
        value="{{ expense.name if expense else '' }}"
        class="w-full rounded-xl px-3.5 py-2.5 text-sm
               bg-bg-base border border-border-def text-txt-primary placeholder-txt-muted
               focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
               transition-colors duration-150"
      />
    </div>

    <!-- 類別 -->
    <div>
      <label for="exp-category" class="block text-xs font-medium text-txt-secondary mb-1.5">
        類別 <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <select
          id="exp-category"
          name="category"
          required
          class="w-full appearance-none rounded-xl px-3.5 py-2.5 text-sm
                 bg-bg-base border border-border-def text-txt-primary
                 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
                 transition-colors duration-150 pr-9"
        >
          {% for cat in categories %}
          <option value="{{ cat }}"
            {% if expense and expense.category == cat %}selected{% endif %}>
            {{ cat }}
          </option>
          {% endfor %}
        </select>
        <!-- Chevron icon -->
        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-txt-muted">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>
    </div>

    <!-- 總金額 -->
    <div>
      <label for="exp-amount" class="block text-xs font-medium text-txt-secondary mb-1.5">
        總金額（TWD） <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-3.5 flex items-center text-txt-muted text-sm pointer-events-none">$</span>
        <input
          id="exp-amount"
          name="amount"
          type="number"
          min="1"
          required
          placeholder="0"
          value="{{ expense.amount if expense else '' }}"
          class="w-full rounded-xl pl-7 pr-3.5 py-2.5 text-sm font-mono
                 bg-bg-base border border-border-def text-txt-primary placeholder-txt-muted
                 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
                 transition-colors duration-150"
        />
      </div>
    </div>

    <!-- 付款人 -->
    <div>
      <label for="exp-payer" class="block text-xs font-medium text-txt-secondary mb-1.5">
        付款人 <span class="text-red-400">*</span>
      </label>
      <div class="relative">
        <select
          id="exp-payer"
          name="payer_id"
          required
          class="w-full appearance-none rounded-xl px-3.5 py-2.5 text-sm
                 bg-bg-base border border-border-def text-txt-primary
                 focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
                 transition-colors duration-150 pr-9"
        >
          {% for m in members %}
          <option value="{{ m.id }}"
            {% if expense and expense.payer_id == m.id %}selected
            {% elif not expense and m.name == '菸齡' %}selected
            {% endif %}>
            {{ m.name }}
          </option>
          {% endfor %}
        </select>
        <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-txt-muted">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </span>
      </div>
    </div>

    <!-- 參與標籤 -->
    <div>
      <span class="block text-xs font-medium text-txt-secondary mb-2">
        排除標籤
        <span class="text-txt-muted font-normal ml-1">（勾選要排除的群組，不勾 = 全員分攤）</span>
      </span>
      {% if all_tags %}
      <div class="flex flex-wrap gap-2">
        {% for tag in all_tags %}
        <label class="flex items-center gap-2 cursor-pointer group">
          <input
            type="checkbox"
            name="tags"
            value="{{ tag }}"
            {% if expense and tag in expense.tags %}checked{% endif %}
            class="w-4 h-4 rounded border-border-def bg-bg-base text-accent-blue
                   focus:ring-accent-blue focus:ring-offset-bg-base
                   cursor-pointer"
          />
          <span class="text-sm text-txt-secondary group-hover:text-txt-primary transition-colors duration-150">
            {{ tag }}
          </span>
        </label>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-xs text-txt-muted">（無可用標籤，請先在 Notion 中設定人員標籤）</p>
      <!-- Hidden fallback to satisfy Form(...) validation — provide an empty sentinel -->
      <input type="hidden" name="tags" value="">
      {% endif %}
    </div>

    <!-- 日期 -->
    <div>
      <label for="exp-date" class="block text-xs font-medium text-txt-secondary mb-1.5">日期</label>
      <input
        id="exp-date"
        name="date"
        type="date"
        value="{{ expense.date if expense else '' }}"
        class="w-full rounded-xl px-3.5 py-2.5 text-sm
               bg-bg-base border border-border-def text-txt-primary
               focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
               transition-colors duration-150
               [color-scheme:dark]"
      />
    </div>

    <!-- 備註 -->
    <div>
      <label for="exp-note" class="block text-xs font-medium text-txt-secondary mb-1.5">備註</label>
      <textarea
        id="exp-note"
        name="note"
        rows="2"
        placeholder="可選，補充說明"
        class="w-full rounded-xl px-3.5 py-2.5 text-sm resize-none
               bg-bg-base border border-border-def text-txt-primary placeholder-txt-muted
               focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue
               transition-colors duration-150"
      >{{ expense.note if expense else '' }}</textarea>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 pt-1">
      <button
        type="button"
        onclick="document.getElementById('modal-container').innerHTML = ''"
        class="flex-1 py-2.5 rounded-xl text-sm font-medium
               bg-bg-base border border-border-def text-txt-secondary
               hover:text-txt-primary hover:border-txt-muted
               active:bg-gray-700 transition-colors duration-150">
        取消
      </button>
      <button
        type="submit"
        class="flex-1 py-2.5 rounded-xl text-sm font-semibold
               bg-accent-blue text-white
               hover:bg-blue-500 active:bg-blue-700
               transition-colors duration-150">
        {% if expense %}儲存變更{% else %}新增帳目{% endif %}
      </button>
    </div>

  </form>
</div>

<!-- Slide-up animation -->
<style>
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .animate-slide-up {
    animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
</style>

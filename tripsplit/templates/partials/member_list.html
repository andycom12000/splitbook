{% if not members %}
<div class="text-center py-12 text-gray-500">
  <p>沒有符合條件的人員</p>
</div>
{% else %}
  {% for m in members %}
  <div class="member-item">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="avatar" style="background: hsl({{ loop.index0 * 47 % 360 }}, 60%, 50%)">
          {{ m.name[0] }}
        </div>
        <div>
          <div class="text-sm font-semibold text-white">{{ m.name }}</div>
        </div>
      </div>
      {% if m.payment_status == "已繳" %}
      <span class="tag tag-paid">已繳</span>
      {% elif m.payment_status == "部分繳" %}
      <span class="tag tag-partial">部分繳</span>
      {% else %}
      <span class="tag tag-unpaid">未繳</span>
      {% endif %}
    </div>
    <div class="flex flex-wrap gap-1 mt-2">
      {% for tag in m.tags %}
      <span class="tag tag-group">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
{% endif %}
